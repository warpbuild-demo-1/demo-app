name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: warpdev-ubuntu-latest-x64-2x
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          echo "Running on $(uname -m) with $(nproc) CPUs"
          sleep 20

  test:
    runs-on: warpdev-ubuntu-latest-x64-2x
    strategy:
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: Test shard ${{ matrix.shard }}
        run: |
          echo "Shard ${{ matrix.shard }}"
          sleep 15

  arm:
    runs-on: warpdev-ubuntu-latest-arm64-2x
    steps:
      - name: Check architecture
        run: uname -m
