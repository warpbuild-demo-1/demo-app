name: Reusable build

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true

jobs:
  build:
    runs-on: warpdev-ubuntu-latest-x64-2x
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ inputs.target }}
        run: |
          echo "Building ${{ inputs.target }} with $(nproc) CPUs"
          sleep 10
